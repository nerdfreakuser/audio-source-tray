<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio Source</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1a1d24;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { position: relative; width: 920px; height: 520px; }
    .card {
      position: absolute;
      right: 120px;
      bottom: 110px;
      width: 280px;
      background: #161618;
      color: #f5f5f7;
      border: 1px solid #3c3c40;
      border-radius: 12px;
      padding: 14px 16px 16px;
      box-sizing: border-box;
    }
    .playing { color: #32d74b; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .app { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #32d74b; flex: none; }
    .detail { color: #aeaeB2; font-size: 12px; margin-top: 4px; padding-left: 16px; }
    .device { color: #6e6e72; font-size: 12px; margin-top: 4px; padding-left: 16px; }
    .vol { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-left: 16px; }
    .track { flex: 1; height: 6px; background: #323236; border-radius: 1px; overflow: hidden; }
    .fill { width: 68%; height: 100%; background: #32d74b; }
    .pct { color: #aeaeB2; font-size: 12px; width: 32px; text-align: right; }
    .icon {
      position: absolute;
      right: 48px;
      bottom: 36px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid #32d74b;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding: 10px 8px 8px;
      box-sizing: border-box;
    }
    .icon span { width: 5px; background: #32d74b; border-radius: 2px; display: block; }
    .icon span:nth-child(1) { height: 10px; }
    .icon span:nth-child(2) { height: 18px; }
    .icon span:nth-child(3) { height: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="playing">PLAYING</div>
      <div class="app"><span class="dot"></span>Google Chrome</div>
      <div class="detail">Watch trending videos for you | TikTok</div>
      <div class="device">Speakers (Realtek(R) Audio)</div>
      <div class="vol"><div class="track"><div class="fill"></div></div><div class="pct">68%</div></div>
    </div>
    <div class="icon" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
